server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                max-age: 3600
          routes:
            - id: socio-service
              uri: lb://SOCIO-SERVICE
              predicates:
                - Path=/api/socios,/api/socios/**
            - id: directiva-service
              uri: lb://SOCIO-SERVICE
              predicates:
                - Path=/api/directivas,/api/directivas/**
            - id: cuentas-service
              uri: lb://CUENTAS-SERVICE
              predicates:
                - Path=/api/cuentas,/api/cuentas/**,/api/aportaciones,/api/aportaciones/**,/api/transacciones,/api/transacciones/**,/api/ahorros-programados,/api/ahorros-programados/**
            - id: prestamo-service
              uri: lb://PRESTAMO-SERVICE
              predicates:
                - Path=/api/prestamos,/api/prestamos/**,/api/productos-financieros,/api/productos-financieros/**,/api/garantias,/api/garantias/**,/api/pago-prestamo,/api/pago-prestamo/**
            - id: usuarios-service
              uri: lb://USUARIOS-SERVICE
              predicates:
                - Path=/api/empleados,/api/empleados/**
            - id: configuration-service
              uri: lb://CONFIGURATION-SERVICE
              predicates:
                - Path=/api/v1/configuracion,/api/v1/configuracion/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoint:
    gateway:
      access: read_only

  endpoints:
    web:
      exposure:
        include: health,info,gateway